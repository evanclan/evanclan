name: Draw activity

# Redraws the activity panel from the contribution calendar and publishes it to
# the `output` branch, so the daily redraw never adds commits to main.

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/draw.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/evanclan-header
          key: fonts-v1

      - run: pip install fonttools uharfbuzz brotli

      - run: python scripts/draw.py activity --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
